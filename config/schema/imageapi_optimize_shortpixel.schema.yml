imageapi_optimize.processor.shortpixel:
  type: mapping
  mapping:
    api_key:
      label: 'ShortPixel API key'
      type: string

    compression_type:
      label: 'Compression type'
      type: string
      description: 'Choose how strongly images should be optimized. If you are not sure, start with Glossy.'
      allowed_values:
        lossy:
          label: 'Lossy'
          description: 'Smallest files. Best when page speed matters more than tiny visual differences.'
        glossy:
          label: 'Glossy'
          description: 'Recommended for most sites. Keeps very good visual quality while still reducing file size.'
        lossless:
          label: 'Lossless'
          description: 'Keeps every pixel unchanged, but file sizes stay larger.'
      default: glossy

    force_drupal_jpeg_quality:
      label: 'Let ShortPixel handle JPEG quality first'
      type: boolean

    use_cdn:
      label: 'Serve images through ShortPixel CDN'
      type: boolean

    cdn_base_url:
      label: 'ShortPixel CDN URL'
      type: string

imageapi_optimize_shortpixel.settings:
  type: config_object
  label: 'ShortPixel delivery settings'
  mapping:
    use_cdn:
      label: 'Serve images through ShortPixel CDN'
      type: boolean

    cdn_base_url:
      label: 'ShortPixel CDN URL'
      type: string

    compression_type:
      label: 'Compression type'
      type: string

imageapi_optimize.processor.shortpixel:
  type: mapping
  mapping:
    api_key:
      label: 'API Key'
      type: string

    compression_type:
      label: 'Compression Type'
      type: string
      description: 'Choose the image compression level.'
      allowed_values:
        lossy:
          label: 'Lossy Compression'
          description: 'Best for most users. Smallest images with an optimal balance between speed and quality.'
        glossy:
          label: 'Glossy Compression'
          description: 'Higher visual quality with a slight trade-off in page speed.'
        lossless:
          label: 'Lossless Compression'
          description: 'Pixel-perfect images with minimal size reduction.'
      default: glossy

    force_drupal_jpeg_quality:
      label: 'Set Drupal GD2 JPEG quality to 100'
      type: boolean

    use_cdn:
      label: 'Rewrite public image URLs to ShortPixel CDN'
      type: boolean

    cdn_base_url:
      label: 'CDN Base URL'
      type: string

imageapi_optimize_shortpixel.settings:
  type: config_object
  label: 'ShortPixel CDN settings'
  mapping:
    use_cdn:
      label: 'Rewrite public image URLs to ShortPixel CDN'
      type: boolean

    cdn_base_url:
      label: 'CDN Base URL'
      type: string

    compression_type:
      label: 'Compression Type'
      type: string
